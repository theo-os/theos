name: CI

on:
  push:
    branches: [canon]
  pull_request:
    branches: [canon]
  merge_group:
    branches: [canon]

jobs:
  build:
    name: Build and Lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Buck2
        uses: dtolnay/install-buck2@latest
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, rust-src
          targets: x86_64-unknown-uefi
      - name: Build Buck2 Targets
        run: |
          buck2 build //...
