name: CI

on:
  push:
    branches: [canon]
  pull_request:
    branches: [canon]
  merge_group:
    branches: [canon]

jobs:
  build:
    name: Build and Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3
      - name: Install LLVM Tools
        run: |
          sudo apt update -y
          sudo apt install -y clang lld
      - name: Build Bazel Targets
        run: |
          bazel build //...
